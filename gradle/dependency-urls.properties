# Every external artifact this build pulls in is pinned here.
#
# Downloads are verified against the SHA-256 below and the build fails on a mismatch, so a
# tampered or silently replaced remote file can never be compiled against. When a mismatch is
# reported, review the new file before updating its checksum here.
#
# Guava and JOML are not listed: they are resolved from Maven Central as normal dependencies and
# verified through gradle/verification-metadata.xml instead.

# Paper API. PaperMC's fill-data URLs already embed the artifact's SHA-256 in the object path,
# so the checksum below must match the hex segment of the URL.
paperJarUrl=https://fill-data.papermc.io/v1/objects/d6a5589a720fbe74b15fd9be6679bff3c55f737801e149fab8337cd0b0a1a989/paper-26.3-180.jar
paperJarSha256=d6a5589a720fbe74b15fd9be6679bff3c55f737801e149fab8337cd0b0a1a989

# ProtocolLib. "dev-build" is a rolling release tag, meaning the jar behind this URL is replaced
# in place whenever upstream publishes a new development build. Without the checksum every machine
# would silently compile against a different jar; with it, a moved dev-build fails the build until
# the new jar has been reviewed and the checksum updated.
protocolLibJarUrl=https://github.com/dmulloy2/ProtocolLib/releases/download/dev-build/ProtocolLib.jar
protocolLibJarSha256=3242a696fbb55a0622d6148d88206ccc392e1d94c5b78ddd423f43ebb82a768a

# PluginCommon is built from source. The commit is pinned so that a moved, rewritten or hijacked
# branch cannot change what this project builds against; the checkout is verified to sit on exactly
# this commit. Bumping it re-checks out the repository and rebuilds it.
pluginCommonRepoUrl=https://github.com/WOODEN-CHEST/PluginCommon.git
pluginCommonCommit=9df3bf6760b630edb64d69bea73df4627fc9d4a6
