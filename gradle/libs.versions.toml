# Versions for dependencies resolved from Maven Central. Their checksums are pinned in
# gradle/verification-metadata.xml, so bumping a version here requires regenerating that file with:
#   gradlew --write-verification-metadata sha256 build
#
# Artifacts that are not resolved from a repository (Paper, ProtocolLib, PluginCommon) are pinned in
# gradle/dependency-urls.properties instead.

[versions]
guava = "33.6.0-jre"
joml = "1.10.9"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
joml = { module = "org.joml:joml", version.ref = "joml" }
